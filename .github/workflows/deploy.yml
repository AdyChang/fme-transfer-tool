# generated-by: github-action-n
# version: 2.1.9
name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGION: asia-east1
  PROJECT_ID: l000-493901
  SERVICE_NAME: fme-transfer-tool
  REGISTRY: asia-east1-docker.pkg.dev/l000-493901/cloud-run-source-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set service name
        id: svc
        run: |
          echo "name=${{ env.SERVICE_NAME }}" >> $GITHUB_OUTPUT

      - name: Check security report
        run: |
          TODAY=$(date +%Y%m%d)
          REPORT=$(ls security-report-${TODAY}-*.docx 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "No security report found. Cannot deploy. Please run security scan first."
            exit 1
          fi
          echo "Security report confirmed: $REPORT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/146561234228/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-sa@l000-493901.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image via Cloud Build
        id: build
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${SHORT_SHA}"
          BUILD_ID=$(gcloud builds submit . \
            --config cloudbuild.yaml \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --substitutions=_IMAGE_TAG=${SHORT_SHA} \
            --format="value(id)" 2>&1 | tail -1)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Built image: $IMAGE (build: $BUILD_ID)"

      - name: Deploy to Cloud Run (no-traffic)
        id: deploy
        run: |
          gcloud run deploy ${{ steps.svc.outputs.name }} \
            --image "${{ steps.build.outputs.image }}" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --no-invoker-iam-check \
            --no-traffic
          URL=$(gcloud run services describe ${{ steps.svc.outputs.name }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Get deployed image digest
        id: image
        run: |
          REVISION=$(gcloud run services describe ${{ steps.svc.outputs.name }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.latestCreatedRevisionName)")
          IMAGE_REF=$(gcloud run revisions describe $REVISION \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(spec.containers[0].image)")
          IMAGE_BASE=$(echo "$IMAGE_REF" | sed 's/@sha256:.*//' | sed 's/:.*//')
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE_REF" \
            --format="value(image_summary.digest)" 2>/dev/null || echo "")
          if [ -z "$DIGEST" ]; then
            RESOURCE_URL="https://$IMAGE_REF"
          else
            RESOURCE_URL="https://${IMAGE_BASE}@${DIGEST}"
          fi
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "resource_url=$RESOURCE_URL" >> $GITHUB_OUTPUT
          echo "Deployed revision: $REVISION"
          echo "Resource URL: $RESOURCE_URL"

      - name: Wait for container scan results
        id: scan
        run: |
          PROJECT="${{ env.PROJECT_ID }}"
          RESOURCE_URL="${{ steps.image.outputs.resource_url }}"
          MAX_WAIT=900
          INTERVAL=30
          ELAPSED=0
          echo "Waiting for container scan results..."
          echo "Target: $RESOURCE_URL"
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            TOKEN=$(gcloud auth print-access-token)
            DISCOVERY=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              --get \
              --data-urlencode "filter=kind=\"DISCOVERY\" AND resourceUri=\"${RESOURCE_URL}\"" \
              "https://containeranalysis.googleapis.com/v1/projects/${PROJECT}/occurrences" \
              2>/dev/null || echo "")
            STATUS=$(echo "$DISCOVERY" | python3 -c "import sys,json; d=json.load(sys.stdin); os=d.get('occurrences',[]); print(os[0].get('discovery',{}).get('analysisStatus','') if os else '')" 2>/dev/null || echo "")
            echo "Discovery status: $STATUS (${ELAPSED}s elapsed)"
            if [ "$STATUS" = "FINISHED_SUCCESS" ] || [ "$STATUS" = "FINISHED_FAILED" ]; then
              echo "Scan complete!"
              VULN=$(curl -sf \
                -H "Authorization: Bearer $TOKEN" \
                --get \
                --data-urlencode "filter=kind=\"VULNERABILITY\" AND resourceUri=\"${RESOURCE_URL}\"" \
                "https://containeranalysis.googleapis.com/v1/projects/${PROJECT}/occurrences" \
                2>/dev/null || echo "")
              COUNT=$(echo "$VULN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('occurrences',[])))" 2>/dev/null || echo "0")
              HIGH=$(echo "$VULN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(sum(1 for o in d.get('occurrences',[]) if any(p.get('fixedVersion',{}).get('name','') not in ['','none'] for p in o.get('vulnerability',{}).get('packageIssue',[]))))" 2>/dev/null || echo "0")
              WARN=$(echo "$VULN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(sum(1 for o in d.get('occurrences',[]) if not any(p.get('fixedVersion',{}).get('name','') not in ['','none'] for p in o.get('vulnerability',{}).get('packageIssue',[]))))" 2>/dev/null || echo "0")
              echo "Found $COUNT vulnerabilities: $HIGH blocking (fix available), $WARN warning-only (no upstream fix)."
              if [ "$HIGH" -gt 0 ]; then
                echo "=== Blocking Vulnerabilities ==="
                echo "$VULN" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(o.get('vulnerability',{}).get('severity',''),o.get('vulnerability',{}).get('shortDescription',''),p.get('affectedPackage',''),p.get('affectedVersion',{}).get('name',''),'->',p.get('fixedVersion',{}).get('name','none')) for o in d.get('occurrences',[]) for p in o.get('vulnerability',{}).get('packageIssue',[])]" 2>/dev/null || true
                echo "CONTAINER_SCAN_PASSED=false" >> $GITHUB_OUTPUT
                exit 1
              else
                echo "CONTAINER_SCAN_PASSED=true" >> $GITHUB_OUTPUT
                break
              fi
            fi
          done

      # 容器掃描通過後自動切換 100% 流量；未通過時上一步已 exit 1，流量維持舊版
      - name: Switch traffic to new revision (100%)
        if: steps.scan.outputs.CONTAINER_SCAN_PASSED == 'true'
        run: |
          SERVICE="${{ steps.svc.outputs.name }}"
          REVISION="${{ steps.image.outputs.revision }}"
          PREV=$(gcloud run services describe "$SERVICE" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format=json | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((t.get('revisionName','') for t in d.get('status',{}).get('traffic',[]) if t.get('percent')),''))" 2>/dev/null || echo "")
          gcloud run services update-traffic "$SERVICE" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --to-revisions="${REVISION}=100"
          echo "=================================================="
          echo "掃描通過，已將 100% 流量切換至 ${REVISION}"
          echo "切換前版本：${PREV}"
          echo "若需回復：Actions -> Switch Traffic -> revision 填 ${PREV}"
          echo "=================================================="

      - name: Show deployed URL
        run: |
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          echo "Image: ${{ steps.build.outputs.image }}"
