# 手動切換 Cloud Run 流量（用來退回舊版）
#
# deploy.yml 在容器掃描通過後會自動切換 100% 流量；
# 本 workflow 用於退回舊版（填入舊 revision）或手動調整流量比例。
#
# 使用方式：GitHub → Actions → 左側選「Switch Traffic」→ 右上「Run workflow」
#
# 使用與 deploy.yml 相同的服務帳號，操作者本人不需要 GCP IAM 權限。
name: Switch Traffic

on:
  workflow_dispatch:
    inputs:
      revision:
        description: '要切換到的 revision 名稱（留空 = 最新建立的 revision）'
        required: false
        type: string
      percent:
        description: '流量百分比'
        required: false
        default: '100'
        type: choice
        options: ['100', '50', '10']

env:
  REGION: asia-east1
  PROJECT_ID: l000-493901
  SERVICE_NAME: fme-transfer-tool

jobs:
  switch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/146561234228/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-sa@l000-493901.iam.gserviceaccount.com"

      - name: Resolve target revision
        id: target
        env:
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          REV="$INPUT_REVISION"
          if [ -z "$REV" ]; then
            REV=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
              --format="value(status.latestCreatedRevisionName)")
            echo "未指定 revision，使用最新建立的：$REV"
          fi
          if [ -z "$REV" ]; then
            echo "無法取得 revision 名稱"; exit 1
          fi
          if ! gcloud run revisions describe "$REV" \
                --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
                --format="value(name)" >/dev/null 2>&1; then
            echo "找不到 revision：$REV，請確認名稱是否正確。"
            echo "目前可用的 revision："
            gcloud run revisions list --service=${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
              --format="table(name, active, creationTimestamp)" --limit=10
            exit 1
          fi
          echo "revision=$REV" >> $GITHUB_OUTPUT

      - name: Show current traffic (before)
        run: |
          echo "=== 切換前流量分配 ==="
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format="table(status.traffic[].revisionName, status.traffic[].percent, status.traffic[].tag)"

      - name: Switch traffic
        env:
          TARGET_REV: ${{ steps.target.outputs.revision }}
          INPUT_PCT: ${{ inputs.percent }}
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --to-revisions="${TARGET_REV}=${INPUT_PCT}"

      - name: Verify result
        run: |
          echo "=== 切換後流量分配 ==="
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format="table(status.traffic[].revisionName, status.traffic[].percent, status.traffic[].tag)"
