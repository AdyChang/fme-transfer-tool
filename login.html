<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 — 庫存調撥系統</title>
<style>
:root {
  --primary: #1E3A5F;
  --accent: #2E75B6;
  --light-blue: #E8F3FB;
  --danger: #DC2626;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-300: #D1D5DB;
  --gray-400: #9CA3AF;
  --gray-500: #6B7280;
  --text: #1A1916;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Arial', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
  background: linear-gradient(135deg, #1E3A5F 0%, #2E75B6 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

/* ── Card ── */
.card {
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 420px;
  overflow: hidden;
}
.card-header {
  background: var(--primary);
  padding: 32px 32px 24px;
  text-align: center;
  color: white;
}
.logo-icon {
  font-size: 36px;
  margin-bottom: 10px;
}
.card-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.card-subtitle {
  font-size: 12px;
  opacity: 0.6;
  letter-spacing: 0.5px;
}
.card-body {
  padding: 32px;
}

/* ── Form ── */
.field { margin-bottom: 20px; }
label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 7px;
}
.input-wrap { position: relative; }
input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--gray-300);
  border-radius: var(--radius);
  font-size: 14px;
  color: var(--text);
  transition: border-color 0.15s, box-shadow 0.15s;
  outline: none;
  background: white;
  font-family: inherit;
}
input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(46,117,182,0.15);
}
input.error-input {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px rgba(220,38,38,0.1);
}

/* Password field with toggle button */
.psw-wrap input {
  padding-right: 44px;
}
.toggle-pw {
  position: absolute;
  right: 0;
  top: 0;
  height: 100%;
  width: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--gray-400);
  border-radius: 0 var(--radius) var(--radius) 0;
  transition: color 0.15s;
  padding: 0;
}
.toggle-pw:hover { color: var(--accent); }
.toggle-pw svg { pointer-events: none; }

/* ── Error msg ── */
.error-box {
  background: #FEF2F2;
  border: 1px solid #FECACA;
  border-radius: var(--radius);
  color: var(--danger);
  font-size: 13px;
  padding: 10px 14px;
  margin-bottom: 18px;
  display: none;
}
.error-box.show { display: block; }

/* ── Submit ── */
.btn-login {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
  font-family: inherit;
  letter-spacing: 0.3px;
}
.btn-login:hover:not(:disabled) { background: #1E5FA8; }
.btn-login:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}
.btn-login .spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Footer ── */
.card-footer {
  text-align: center;
  padding: 0 32px 24px;
  font-size: 11px;
  color: var(--gray-400);
}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo-icon">📦</div>
    <div class="card-title">庫存調撥系統</div>
    <div class="card-subtitle">Inventory Transfer Suggestion System</div>
  </div>

  <div class="card-body">
    <div class="error-box" id="error-box"></div>

    <div class="field">
      <label for="user-id">公司帳號</label>
      <div class="input-wrap">
        <input type="text" id="user-id" maxlength="15"
               placeholder="請輸入公司帳號" autocomplete="username">
      </div>
    </div>

    <div class="field">
      <label for="password">密碼</label>
      <div class="input-wrap psw-wrap">
        <input type="password" id="password" maxlength="30"
               placeholder="請輸入密碼" autocomplete="current-password">
        <button type="button" class="toggle-pw" id="toggle-pw"
                aria-label="顯示／隱藏密碼" title="顯示／隱藏密碼">
          <!-- Eye icon (default: hidden = show) -->
          <svg id="icon-eye" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- Eye-off icon (shown when password visible) -->
          <svg id="icon-eye-off" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
                     a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4
                     c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07
                     a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-login" id="btn-login" onclick="doLogin()">登入</button>
  </div>

  <div class="card-footer">日翊文化行銷股份有限公司 &nbsp;·&nbsp; 物流本部</div>
</div>

<script>
// ── Password show/hide toggle ──
const pwInput  = document.getElementById('password');
const iconEye  = document.getElementById('icon-eye');
const iconOff  = document.getElementById('icon-eye-off');

document.getElementById('toggle-pw').addEventListener('click', function() {
  const showing = pwInput.type === 'text';
  pwInput.type = showing ? 'password' : 'text';
  iconEye.style.display = showing ? '' : 'none';
  iconOff.style.display = showing ? 'none' : '';
  pwInput.focus();
});

// ── Enter key submits ──
document.getElementById('user-id').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ── Login ──
async function doLogin() {
  const userId   = document.getElementById('user-id').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btn-login');
  const errBox   = document.getElementById('error-box');

  clearErrors();

  if (!userId)   { showError('請輸入公司帳號'); return; }
  if (!password) { showError('請輸入密碼');     return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>驗證中…';

  try {
    const res  = await fetch('https://eip.fme.com.tw/FMEIP/AasApi/CheckUserId', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ USER_ID: userId, PSW: password })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    const code = (data.MSG || '').split(' ')[0];

    if (code === '000') {
      try {
        sessionStorage.setItem('fme_transfer_user',
          JSON.stringify({ userId, ts: Date.now() }));
      } catch (_) {}
      window.location.replace('index.html');
      return;
    }

    const msgs = {
      '100': '帳號或密碼錯誤，請確認後重試',
      '200': 'AD 認證錯誤，請聯絡 IT 人員',
      '998': '系統暫時無法使用，請稍後再試',
      '999': '系統發生錯誤，請聯絡管理員'
    };
    showError(msgs[code] || '登入失敗，請聯絡管理員（代碼：' + code + '）');

  } catch (err) {
    showError('網路連線失敗，請確認網路後再試');
  } finally {
    btn.disabled = false;
    btn.textContent = '登入';
  }
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.classList.add('show');
  document.getElementById('user-id').classList.add('error-input');
  document.getElementById('password').classList.add('error-input');
}
function clearErrors() {
  const box = document.getElementById('error-box');
  box.classList.remove('show');
  document.getElementById('user-id').classList.remove('error-input');
  document.getElementById('password').classList.remove('error-input');
}
</script>
</body>
</html>
